name: Public repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node.js test dependencies
        run: npm ci --ignore-scripts

      - name: Run deterministic public checks
        run: python -X utf8 scripts/run_public_checks.py

      - name: Scan reachable history
        run: python -X utf8 scripts/privacy_scan.py --root . --history
